

name: CICD Pipeline

on:
  push:
    branches: [ "main" ]
  

jobs:
  compile:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn compile

  security_check:
    runs-on: self-hosted
    needs: compile

    steps:
    - uses: actions/checkout@v4
    - name: Trivy installation
      run: |
       sudo dnf install -y wget tar curl

        LATEST=$(curl -s https://api.github.com/repos/aquasecurity/trivy/releases/latest | grep tag_name | cut -d '"' -f 4)
        
        VERSION=${LATEST#v}
        
        wget https://github.com/aquasecurity/trivy/releases/download/${LATEST}/trivy_${VERSION}_Linux-64bit.tar.gz
        
        tar -xvf trivy_${VERSION}_Linux-64bit.tar.gz
        
        sudo mv trivy /usr/local/bin/
        
        trivy --version

    - name: Trivy fs scan
      run: trivy fs --format table -o fs-report.json .

    - name: gitleaks installation
      run: sudo apt install gitleaks -y

    - name: gitleaks code scan
      run: gitleaks detect source . -r gitleaks-report.json 
    

